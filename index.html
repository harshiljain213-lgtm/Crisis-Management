<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

    html,body,#root{width:100%;height:100%;min-height:600px}
    body{background:#020617;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
    .glass{background:rgba(15,23,42,0.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.07)}
    .glass-light{background:rgba(30,41,59,0.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08)}
    @keyframes pulse-ring{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.8);opacity:0}}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideInRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fadeOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(18px)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes toast-in{from{opacity:0;transform:translateY(18px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateY(-14px)}}
    @keyframes shimmer{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}
    @keyframes countUp{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}

    .animate-slideInRight{animation:slideInRight 0.3s ease forwards}

    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:#ea580c;border-radius:2px}
    .kpi-card{border-radius:12px;padding:16px;position:relative;overflow:hidden;transition:transform 0.2s}

    .leaflet-popup-content-wrapper{background:rgba(15,23,42,0.97)!important;border:1px solid rgba(255,255,255,0.12)!important;border-radius:10px!important;padding:0!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important}

    .toast{position:fixed;bottom:20px;right:20px;z-index:10000;padding:14px 16px;border-radius:12px;min-width:260px;max-width:340px;display:flex;align-items:flex-start;gap:10px;font-family:'Space Grotesk',sans-serif}

    .ai-typing{display:inline-flex;gap:4px;align-items:center}

    .leaflet-control-attribution a{color:#475569!important}
    .leaflet-control-zoom{display:none}
  </style>
</head>

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', icon: '⊞' },

  const ASSET_TYPES = ['Helicopter', 'Ground Convoy', 'Medical Team', 'Water Tanker', 'Emergency Response Unit', 'Drone Recon', 'Field Hospital'];

  const INITIAL_ASSETS = [
    { name: 'Helicopters', count: 8, deployed: 5, icon: '🚁', color: '#38bdf8', type: 'Helicopter' },

  ];

  async function callClaudeAI(prompt, systemPrompt) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt || 'You are ReliefSync, an expert humanitarian AI crisis coordinator. Provide precise, actionable crisis relief recommendations. Be direct and data-focused. Respond in JSON only, no markdown.',
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.map(b => b.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  }

  /* ══════════════════════════════════════════════
     REAL LEAFLET MAP COMPONENT
  ══════════════════════════════════════════════ */
  function LeafletMap({ zones, selectedZone, onZoneClick, height = 260, mapId = 'leaflet-map' }) {
    const mapRef = useRef(null);
    const leafletRef = useRef(null);
    const markersRef = useRef({});

    useEffect(() => {
      if (leafletRef.current) return;
      // Give DOM time to render
      setTimeout(() => {
        const map = L.map(mapId, {
          center: [15, 30],
          zoom: 2,
          zoomControl: false,
          attributionControl: true,
          scrollWheelZoom: false,
          doubleClickZoom: false,
        });

        // Dark OpenStreetMap tile
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors',
          maxZoom: 18,
        }).addTo(map);

        leafletRef.current = map;

        // Add markers
        zones.forEach(zone => {
          const priorityColors = { Critical: '#f43f5e', High: '#ea580c', Medium: '#eab308', Low: '#10b981' };
          const color = priorityColors[zone.priority] || '#38bdf8';
          const size = zone.priority === 'Critical' ? 14 : zone.priority === 'High' ? 11 : 9;

          const icon = L.divIcon({
            className: '',
            html: `
              <div style="position:relative;width:${size*3}px;height:${size*3}px;display:flex;align-items:center;justify-content:center;">
                <div style="position:absolute;width:${size*2.5}px;height:${size*2.5}px;border-radius:50%;border:1.5px solid ${color};animation:pulse-ring 1.8s ease-out infinite;opacity:0;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
                <div style="position:absolute;width:${size*2}px;height:${size*2}px;border-radius:50%;border:1.5px solid ${color};animation:pulse-ring 2.1s ease-out 0.3s infinite;opacity:0;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
                <div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 ${size}px ${color};animation:pulse-dot 1.5s ease-in-out infinite;position:relative;z-index:1;cursor:pointer"></div>
              </div>`,
            iconSize: [size * 3, size * 3],
            iconAnchor: [size * 1.5, size * 1.5],
          });

          const marker = L.marker([zone.lat, zone.lng], { icon }).addTo(map);

          const worst = Math.min(...Object.values(zone.resources));
          marker.bindPopup(`
            <div style="padding:12px 14px;min-width:200px">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
                <span style="background:${color}25;color:${color};border:1px solid ${color}50;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;text-transform:uppercase">${zone.priority}</span>
                <span style="font-size:13px;font-weight:700;color:#e2e8f0">${zone.city}</span>
              </div>
              <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">${zone.country} · ${zone.region}</div>
              <div style="font-size:11px;color:#64748b;margin-bottom:8px;line-height:1.5">${zone.crisis.slice(0,80)}...</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px">
                <div style="background:rgba(255,255,255,0.04);border-radius:6px;padding:5px 8px">
                  <div style="font-size:9px;color:#475569;text-transform:uppercase;margin-bottom:2px">Displaced</div>
                  <div style="font-size:13px;font-weight:700;color:${color};font-family:monospace">${zone.displaced.toLocaleString()}</div>
                </div>
                <div style="background:rgba(255,255,255,0.04);border-radius:6px;padding:5px 8px">
                  <div style="font-size:9px;color:#475569;text-transform:uppercase;margin-bottom:2px">Worst KPI</div>
                  <div style="font-size:13px;font-weight:700;color:${worst<25?'#f43f5e':worst<45?'#ea580c':'#eab308'};font-family:monospace">${worst}%</div>
                </div>
              </div>
              <div style="font-size:10px;color:#475569;margin-bottom:3px">Priority needs:</div>
              <div style="display:flex;flex-wrap:wrap;gap:3px">
                ${zone.needs.slice(0,3).map(n=>`<span style="font-size:10px;background:rgba(234,88,12,0.1);color:#fb923c;border:1px solid rgba(234,88,12,0.25);border-radius:4px;padding:2px 6px">${n}</span>`).join('')}
              </div>
            </div>`, { maxWidth: 260, className: '' });

          marker.on('click', () => onZoneClick(zone));
          markersRef.current[zone.id] = marker;
        });

        // Fit bounds to all zones
        const bounds = zones.map(z => [z.lat, z.lng]);
        map.fitBounds(bounds, { padding: [30, 30] });
      }, 150);

      return () => {
        if (leafletRef.current) {
          leafletRef.current.remove();
          leafletRef.current = null;
        }
      };
    }, []);

    // Highlight selected zone
    useEffect(() => {
      if (!leafletRef.current || !selectedZone) return;
      const marker = markersRef.current[selectedZone.id];
      if (marker) {
        marker.openPopup();
        leafletRef.current.setView([selectedZone.lat, selectedZone.lng], 4, { animate: true });
      }
    }, [selectedZone?.id]);

    return (
      <div ref={mapRef} style={{ height, width: '100%' }}>

  function Toast({ toast, onDismiss }) {
    useEffect(() => { if (!toast) return; const t = setTimeout(onDismiss, 4500); return () => clearTimeout(t); }, [toast]);
    if (!toast) return null;
    const cols = { success: '#10b981', error: '#f43f5e', info: '#38bdf8' };
    const bgs = { success: 'rgba(16,185,129,0.14)', error: 'rgba(244,63,94,0.14)', info: 'rgba(56,189,248,0.14)' };
    const c = cols[toast.type] || cols.info;
    return (
      <div className={`toast glass ${toast.show ? 'show' : 'hide'}`} style={{ background: bgs[toast.type] || bgs.info, border: `1px solid ${c}35` }}>
        <span style={{ fontSize: 18, color: c, flexShrink: 0 }}>{toast.type === 'success' ? '✓' : toast.type === 'error' ? '✕' : 'ℹ'}</span>
        <div><div style={{ fontWeight: 600, color: c, fontSize: 13 }}>{toast.title}</div><div style={{ fontSize: 11, color: '#94a3b8', marginTop: 2, lineHeight: 1.5 }}>{toast.msg}</div></div>
      </div>
    );
  }

  function KpiCard({ label, value, icon, color, danger, warn, unit, index }) {

    useEffect(() => { const t = setTimeout(() => setAnim(true), index * 100); return () => clearTimeout(t); }, []);
    const c = value <= danger ? '#f43f5e' : value <= warn ? '#ea580c' : color;
    const status = value <= danger ? 'CRITICAL' : value <= warn ? 'WARNING' : 'NOMINAL';
    return (
      <div className="kpi-card glass" style={{ animation: `fadeInUp 0.4s ease ${index * 0.07}s both` }}>
        <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse at top right, ${c}10, transparent 65%)`, borderRadius: 12, pointerEvents: 'none' }} />

          <div>
            <div style={{ fontSize: 20 }}>{icon}</div>

    return <span className="weather-badge">{icon} {w.condition} · {w.temp}°C · 💨{w.wind}km/h</span>;

  function DeployModal({ open, onClose, onDeploy, zones }) {
    const [form, setForm] = useState({ assetType: '', quantity: '', zone: '', priority: '', notes: '' });
    const [errors, setErrors] = useState({});
    const [step, setStep] = useState(1);
    if (!open) return null;
    const set = (k, v) => { setForm(f => ({ ...f, [k]: v })); setErrors(e => ({ ...e, [k]: '' })); };
    const validate = () => {
      const e = {};
      if (!form.assetType) e.assetType = 'Asset type required';
      if (!form.quantity || isNaN(form.quantity) || +form.quantity < 1) e.quantity = 'Valid quantity required';
      if (!form.zone) e.zone = 'Target zone required';
      if (!form.priority) e.priority = 'Priority required';
      setErrors(e); return Object.keys(e).length === 0;
    };
    const handleConfirm = () => { onDeploy(form); setForm({ assetType: '', quantity: '', zone: '', priority: '', notes: '' }); setStep(1); };
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && (onClose(), setStep(1))}>
        <div className="modal-box glass">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: '#e2e8f0' }}>Deploy Asset</div>
              <div style={{ fontSize: 11, color: '#64748b', marginTop: 2 }}>Step {step}/2 — {step === 1 ? 'Configuration' : 'Confirm Deployment'}</div>
            </div>
            <button onClick={() => { onClose(); setStep(1); }} style={{ background: 'none', border: 'none', color: '#64748b', cursor: 'pointer', fontSize: 18 }}>✕</button>
          </div>
          <div style={{ display: 'flex', gap: 5, marginBottom: 20 }}>
            {[1, 2].map(n => <div key={n} style={{ flex: 1, height: 3, borderRadius: 2, background: n <= step ? '#ea580c' : 'rgba(255,255,255,0.08)', transition: 'background 0.3s' }} />)}
          </div>
          {step === 1 ? (
            <div>
              <div className="form-group">
                <label className="form-label">Asset Type *</label>
                <select className={`form-select ${errors.assetType ? 'error' : ''}`} value={form.assetType} onChange={e => set('assetType', e.target.value)}>
                  <option value="">Select...</option>
                  {ASSET_TYPES.map(a => <option key={a}>{a}</option>)}
                </select>
                {errors.assetType && <div className="error-msg">{errors.assetType}</div>}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <div className="form-group">
                  <label className="form-label">Quantity *</label>
                  <input type="number" min="1" className={`form-input ${errors.quantity ? 'error' : ''}`} placeholder="e.g. 4" value={form.quantity} onChange={e => set('quantity', e.target.value)} />
                  {errors.quantity && <div className="error-msg">{errors.quantity}</div>}
                </div>
                <div className="form-group">
                  <label className="form-label">Priority *</label>
                  <select className={`form-select ${errors.priority ? 'error' : ''}`} value={form.priority} onChange={e => set('priority', e.target.value)}>
                    <option value="">Select...</option>
                    {PRIORITY_LEVELS.map(p => <option key={p}>{p}</option>)}
                  </select>
                  {errors.priority && <div className="error-msg">{errors.priority}</div>}
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Target Crisis Zone *</label>
                <select className={`form-select ${errors.zone ? 'error' : ''}`} value={form.zone} onChange={e => set('zone', e.target.value)}>
                  <option value="">Select crisis zone...</option>
                  {zones.map(z => <option key={z.id} value={z.id}>{z.city}, {z.country} [{z.priority}]</option>)}
                </select>
                {errors.zone && <div className="error-msg">{errors.zone}</div>}
              </div>
              <div className="form-group">
                <label className="form-label">Operational Notes</label>
                <textarea className="form-input" rows={3} placeholder="Route details, special conditions, contacts..." value={form.notes} onChange={e => set('notes', e.target.value)} style={{ resize: 'vertical' }} />
              </div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 4 }}>
                <button className="btn-ghost" onClick={() => { onClose(); setStep(1); }}>Cancel</button>
                <button className="btn-primary" onClick={() => validate() && setStep(2)}>Review →</button>
              </div>
            </div>
          ) : (
            <div>
              <div style={{ background: 'rgba(234,88,12,0.08)', border: '1px solid rgba(234,88,12,0.25)', borderRadius: 10, padding: 14, marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: '#ea580c', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 10 }}>⚠ Confirm Deployment Order</div>
                {[['Asset Type', form.assetType], ['Quantity', form.quantity + ' units'], ['Target Zone', (zones.find(z => z.id === form.zone)?.city || '') + ', ' + (zones.find(z => z.id === form.zone)?.country || '')], ['Priority', form.priority], ...(form.notes ? [['Notes', form.notes]] : [])].map(([k, v]) => (
                  <div key={k} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 7, paddingBottom: 7, borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                    <span style={{ color: '#64748b' }}>{k}</span>
                    <span style={{ color: '#e2e8f0', fontWeight: 500 }}>{v}</span>
                  </div>
                ))}
              </div>
              <div style={{ fontSize: 11, color: '#475569', marginBottom: 14, lineHeight: 1.6 }}>This deployment will be logged in the operational record and routed to field coordination. Authorization required.</div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                <button className="btn-ghost" onClick={() => setStep(1)}>← Back</button>
                <button className="btn-success" onClick={handleConfirm}>✓ Authorize & Deploy</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

${topZones.map(z => `- ${z.city}, ${z.country}: ${z.crisis}. Worst resource: ${Math.min(...Object.values(z.resources))}%. Displaced: ${z.displaced.toLocaleString()}. Weather: ${z.weather.condition} ${z.weather.temp}°C`).join('\n')}

Return JSON array of exactly 3 objects, each with:
{
  "id": number,
  "from": "real logistics hub city and country",
  "to": "exact city and country from the list",
  "resource": "specific resource type",
  "qty": "realistic specific quantity with units",
  "urgency": "Critical|High|Medium",
  "confidence": number (70-99),
  "reasoning": "one sentence explaining the logistics rationale"
}`
        );
        const arr = Array.isArray(result) ? result : result.strategies || result.recommendations || [];
        setStrategies(arr.slice(0, 3));

        setStrategies(topZones.slice(0, 3).map((z, i) => ({

          from: ['Dubai Logistics Hub (UAE)', 'Nairobi Regional Hub (Kenya)', 'Djibouti Forward Base'][i],
          to: `${z.city}, ${z.country}`,
          resource: ['Water Purification', 'Emergency Medical Kits', 'Food Aid Packages'][i],
          qty: ['40,000L capacity', '850 units', '12,000 packs'][i],
          urgency: z.priority,

    const resolveAlert = useCallback((id) => {

    }, []);

    /* ═══ KEY: Dynamic stats update on deploy ═══ */
    const executeStrategy = useCallback((s) => {
      // Boost resources for the target zone after AI strategy execution
      setZones(prev => prev.map(z => {
        if (s.to && s.to.includes(z.city)) {
          const boost = { water: 0, food: 0, meds: 0, power: 0 };
          const r = (s.resource || '').toLowerCase();
          if (r.includes('water') || r.includes('purif')) boost.water = Math.min(15, 100 - z.resources.water);
          if (r.includes('food') || r.includes('ration')) boost.food = Math.min(12, 100 - z.resources.food);
          if (r.includes('med') || r.includes('kit')) boost.meds = Math.min(14, 100 - z.resources.meds);
          if (r.includes('fuel') || r.includes('power') || r.includes('gen')) boost.power = Math.min(16, 100 - z.resources.power);
          // small cross-boost
          const keys = Object.keys(boost);
          keys.forEach(k => { if (boost[k] === 0) boost[k] = 3; });
          return {
            ...z,
            deployed: z.deployed + 1,
            resources: {
              water: Math.min(100, z.resources.water + boost.water),
              food: Math.min(100, z.resources.food + boost.food),
              meds: Math.min(100, z.resources.meds + boost.meds),
              power: Math.min(100, z.resources.power + boost.power),
            },
            displaced: Math.max(0, z.displaced - Math.floor(z.displaced * 0.04)),
          };
        }
        return z;
      }));
      setTotalDeployed(d => d + 1);
      showToast('success', `Deployment Authorized: ${s.resource}`, `${s.qty} routing to ${s.to} via confirmed logistics corridor. Zone stats updated.`);
    }, []);

    const deployAsset = useCallback((form) => {
      setShowModal(false);
      const z = zones.find(x => x.id === form.zone);

      // Update asset inventory
      setAssets(prev => prev.map(a => {
        if (a.type === form.assetType || a.name.toLowerCase().includes(form.assetType.toLowerCase())) {
          return { ...a, deployed: Math.min(a.count, a.deployed + qty) };
        }
        return a;
      }));

      // Update zone stats based on asset type
      if (z) {
        setZones(prev => prev.map(zone => {
          if (zone.id !== z.id) return zone;
          const boost = {};
          const t = form.assetType.toLowerCase();
          if (t.includes('water')) boost.water = Math.min(20, 100 - zone.resources.water);
          if (t.includes('medical')) boost.meds = Math.min(18, 100 - zone.resources.meds);
          if (t.includes('field hospital')) { boost.meds = Math.min(22, 100 - zone.resources.meds); boost.power = Math.min(10, 100 - zone.resources.power); }

          if (t.includes('helicopter')) { boost.meds = Math.min(12, 100 - zone.resources.meds); boost.food = Math.min(8, 100 - zone.resources.food); }
          if (t.includes('emergency response')) { boost.water = Math.min(10, 100 - zone.resources.water); boost.food = Math.min(10, 100 - zone.resources.food); }
          // Default small boost across all if nothing matched
          if (Object.keys(boost).length === 0) { boost.water = 5; boost.food = 5; boost.meds = 5; boost.power = 5; }
          return {
            ...zone,
            deployed: zone.deployed + qty,
            displaced: Math.max(0, zone.displaced - Math.floor(zone.displaced * 0.03 * qty)),
            resources: {
              water: Math.min(100, zone.resources.water + (boost.water || 2)),
              food: Math.min(100, zone.resources.food + (boost.food || 2)),
              meds: Math.min(100, zone.resources.meds + (boost.meds || 2)),
              power: Math.min(100, zone.resources.power + (boost.power || 2)),
            }
          };
        }));
      }

                      <p style={{ fontSize: 11, color: '#475569', marginTop: 1 }}>Click any zone on the map or list for real-time AI analysis</p>

                          <span className="mono" style={{ fontSize: 22, fontWeight: 700, color: a.color }}>{a.count - a.deployed}</span>
                        </div>
                        <div style={{ fontSize: 9, color: '#334155', marginTop: 4 }}>Available</div>
                        <div className="progress-bar">
                          <div style={{ height: '100%', borderRadius: 2, background: `linear-gradient(90deg,${a.color}70,${a.color})`, width: `${Math.round(a.deployed / a.count * 100)}%`, transition: 'width 1.2s ease' }} />
                        </div>
                        <button className="btn-ghost" onClick={() => setShowModal(true)} style={{ marginTop: 9, width: '100%', fontSize: 11 }}>Deploy →</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* BRIEFINGS */}
              {activeNav === 'reports' && (
                <div>
                  <h1 style={{ fontSize: 15, fontWeight: 700, color: '#e2e8f0', marginBottom: 3 }}>Operational Briefings</h1>
                  <p style={{ fontSize: 11, color: '#475569', marginBottom: 12 }}>Zone-by-zone situational reports — stats reflect latest deployments</p>
                  {zones.map(z => (
                    <div key={z.id} className="glass" style={{ borderRadius: 10, padding: 14, marginBottom: 10, animation: 'fadeInUp 0.35s ease both' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 9 }}>
                        <div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 3, flexWrap: 'wrap' }}>
                            <span className={`badge badge-${z.priority.toLowerCase()}`}>{z.priority}</span>
                            <span style={{ fontSize: 13, fontWeight: 700, color: '#e2e8f0' }}>{z.city}, {z.country}</span>
                            {z.deployed > 0 && <span style={{ fontSize: 9, background: 'rgba(16,185,129,0.15)', color: '#10b981', border: '1px solid rgba(16,185,129,0.3)', borderRadius: 4, padding: '1px 6px' }}>+{z.deployed} deployed</span>}
                          </div>
                          <div style={{ fontSize: 11, color: '#64748b' }}>{z.crisis}</div>
                        </div>
                        <WeatherBadge w={z.weather} />
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 6, marginBottom: 9 }}>
                        {[['💧', z.resources.water, '#38bdf8'], ['🌾', z.resources.food, '#a3e635'], ['💊', z.resources.meds, '#f43f5e'], ['⚡', z.resources.power, '#fbbf24']].map(([ic, v, c], i) => (
                          <div key={i} style={{ textAlign: 'center', background: 'rgba(255,255,255,0.03)', borderRadius: 7, padding: '6px 4px' }}>
                            <div style={{ fontSize: 13 }}>{ic}</div>
                            <div className="mono" style={{ fontSize: 14, fontWeight: 700, color: v < 30 ? '#f43f5e' : v < 50 ? '#ea580c' : c }}>{v}%</div>
                          </div>
                        ))}
                      </div>
                      <div style={{ fontSize: 10, color: '#475569', marginBottom: 4 }}>👥 {z.displaced.toLocaleString()} displaced</div>
                      <div style={{ fontSize: 10, color: '#475569', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 5 }}>Priority Needs</div>
                      <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                        {z.needs.map(n => <span key={n} style={{ fontSize: 10, background: 'rgba(234,88,12,0.1)', color: '#fb923c', border: '1px solid rgba(234,88,12,0.25)', borderRadius: 5, padding: '2px 8px' }}>{n}</span>)}
                      </div>
                      <button className="btn-ghost" style={{ marginTop: 9, fontSize: 11 }} onClick={() => { setSelectedZone(z); setShowAIPanel(true); setActiveNav('intelligence'); }}>
                        ✦ View AI Analysis →
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* RIGHT SIDEBAR */}
            <aside style={{ width: 260, minWidth: 260, borderLeft: '1px solid rgba(255,255,255,0.06)', display: 'flex', flexDirection: 'column', background: 'rgba(2,6,23,0.5)', backdropFilter: 'blur(6px)', overflow: 'hidden' }}>
              <div style={{ padding: '11px 13px 9px', borderBottom: '1px solid rgba(255,255,255,0.06)', flexShrink: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                    <div className="live-dot" />
                    <span style={{ fontSize: 10, fontWeight: 700, color: '#f43f5e', letterSpacing: '0.1em' }}>LIVE ALERTS</span>
                  </div>
                  <span style={{ background: '#f43f5e', color: '#fff', borderRadius: '999px', fontSize: 9, fontWeight: 700, padding: '1px 6px' }}>{alerts.length}</span>
                </div>
              </div>
              <div className="scroll-panel" style={{ flex: 1, padding: '9px', overflowY: 'auto' }}>
                {alerts.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '28px 14px', color: '#334155' }}><div style={{ fontSize: 20, marginBottom: 6 }}>✓</div><div style={{ fontSize: 11 }}>All clear</div></div>
                ) : alerts.map(a => <AlertItem key={a.id} alert={a} onResolve={resolveAlert} />)}
              </div>
              {/* AI Quick Rec */}
              <div style={{ borderTop: '1px solid rgba(255,255,255,0.06)', padding: '9px 11px', flexShrink: 0 }}>
                <div className="section-title" style={{ marginBottom: 7 }}>AI Quick Action</div>
                {strategiesLoading ? (
                  <div style={{ display: 'flex', gap: 5, alignItems: 'center', fontSize: 11, color: '#475569', padding: '8px 0' }}><div className="ai-typing"><span /><span /><span /></div>Generating...</div>
                ) : strategies.slice(0, 1).map(s => (
                  <div key={s.id} style={{ background: 'rgba(56,189,248,0.06)', border: '1px solid rgba(56,189,248,0.15)', borderRadius: 8, padding: '9px 11px' }}>
                    <div style={{ fontSize: 11, color: '#38bdf8', fontWeight: 600, marginBottom: 3 }}>{s.resource}</div>
                    <div style={{ fontSize: 10, color: '#64748b' }}>→ {s.to}</div>
                    <div style={{ fontSize: 10, color: '#64748b', marginTop: 2 }}>Qty: <span className="mono" style={{ color: '#e2e8f0' }}>{s.qty}</span></div>
                    <div style={{ fontSize: 10, color: '#10b981', marginTop: 4 }} className="mono">{s.confidence}% confidence</div>
                    <button className="btn-primary" style={{ width: '100%', marginTop: 8, fontSize: 11, padding: '6px' }} onClick={() => executeStrategy(s)}>▶ Execute</button>
                  </div>
                ))}
                {/* Worst conditions — live updated */}
                <div style={{ marginTop: 10 }}>
                  <div className="section-title" style={{ marginBottom: 6 }}>Worst Conditions</div>
                  {[...zones].sort((a, b) => Math.min(...Object.values(a.resources)) - Math.min(...Object.values(b.resources))).slice(0, 3).map(z => (
                    <div key={z.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '5px 0', borderBottom: '1px solid rgba(255,255,255,0.04)', cursor: 'pointer' }}
                      onClick={() => { setSelectedZone(z); setShowAIPanel(true); setActiveNav('intelligence'); }}>
                      <div>
                        <div style={{ fontSize: 11, color: '#cbd5e1', fontWeight: 500 }}>{z.city}</div>
                        <div style={{ fontSize: 9, color: '#475569' }}>{z.country}</div>
                      </div>
                      <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: z.color }}>{Math.min(...Object.values(z.resources))}%</div>
                    </div>
                  ))}
                </div>
              </div>
            </aside>
          </div>
        </main>

        <DeployModal open={showModal} onClose={() => setShowModal(false)} onDeploy={deployAsset} zones={zones} />
        <Toast toast={toast} onDismiss={() => setToast(null)} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
